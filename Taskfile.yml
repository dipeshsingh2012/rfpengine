version: '3'

dotenv: ['.env']

includes:
  backend: ./backend/Taskfile.yml
  frontend: ./frontend/Taskfile.yml

tasks:
  default:
    desc: "List all available tasks"
    cmds:
      - task --list

  install:
    desc: "Install all backend and frontend dependencies"
    cmds:
      - task: backend:install
      - task: frontend:install

  dev:
    desc: "Start backend and frontend development servers concurrently"
    deps:
      - backend:dev
      - frontend:dev

  test:
    desc: "Run full polyglot automated test suite (Pytest + Frontend Build & Typecheck)"
    cmds:
      - task: backend:test
      - task: frontend:build

  build:
    desc: "Build all production distribution bundles"
    cmds:
      - task: frontend:build

  db:sync:
    desc: "Synchronize all canonical roadmap initiatives into PostgreSQL"
    cmds:
      - task: backend:db:sync

  db:verify:
    desc: "Run live PostgreSQL schema and roadmap verification script"
    cmds:
      - task: backend:db:verify

  verify:all:
    desc: "Run complete enterprise verification matrix (backend, frontend, db)"
    cmds:
      - task: backend:test
      - task: backend:db:verify
      - task: frontend:build

