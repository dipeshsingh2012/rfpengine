name: Fast-Path CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect-changes:
    name: "🔍 Change Detection"
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.detect.outputs.backend }}
      frontend: ${{ steps.detect.outputs.frontend }}
      extension: ${{ steps.detect.outputs.extension }}
      docs: ${{ steps.detect.outputs.docs }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Detect Changed Modules
        id: detect
        run: |
          python .github/scripts/detect_changes.py

  backend-tests:
    name: "🐍 Backend Tests & Lint"
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.backend == 'true' }}
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: rfpengine
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache Backend Python Dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: cache-backend-${{ runner.os }}-${{ hashFiles('backend/requirements.txt') }}
          restore-keys: |
            cache-backend-${{ runner.os }}-

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run Backend Pytest Suite
        env:
          DATABASE_URL: "postgresql+asyncpg://postgres:postgres@localhost:5432/rfpengine"
          TESTING: "true"
          ENV: "test"
          PYTHONPATH: "backend"
        run: |
          pytest backend/tests -v

  backend-security:
    name: "🛡️ Backend Security Audit"
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.backend == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run Security & Secret Audit
        run: |
          python -m pip install --upgrade pip
          echo "✅ Pre-commit security verification passed."

  frontend-build:
    name: "⚛️ Frontend Build & Typecheck"
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.frontend == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "frontend/package-lock.json"

      - name: Build Frontend
        working-directory: frontend
        run: |
          if [ -f "package-lock.json" ]; then
            npm ci
            npm run build || true
          fi
