name: Deploy Backend to Google Cloud Run

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - 'terraform/**'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target Deployment Environment'
        required: true
        default: 'prod'
        type: choice
        options:
          - prod
          - staging

env:
  GCP_PROJECT_ID: rfpengine
  GCP_REGION: us-central1
  GAR_REPOSITORY: rfpengine-repo
  SERVICE_NAME: rfpengine-api
  IMAGE_NAME: us-central1-docker.pkg.dev/rfpengine/rfpengine-repo/rfpengine-api
  PROD_HEALTH_URL: https://rfpengine-api-fwwnzie4dq-uc.a.run.app/health

jobs:
  # 1. Automated Test Suite & Validation
  test:
    name: Run Unit Tests & Validation
    runs-on: ubuntu-latest
    outputs:
      has_gcp_secret: ${{ steps.check_secret.outputs.has_secret }}
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest pytest-asyncio

      - name: Run Document Parser & Unit Tests
        env:
          PYTHONPATH: .
        run: |
          pytest tests/test_document_parser.py -v

      - name: Check GCP Deployment Secret
        id: check_secret
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
        run: |
          if [ -n "$GCP_SA_KEY" ]; then
            echo "has_secret=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_secret=false" >> "$GITHUB_OUTPUT"
          fi

  # 2. Build, Push Docker Image & Deploy to Google Cloud Run
  deploy:
    name: Build & Deploy to Cloud Run
    needs: test
    if: ${{ needs.test.outputs.has_gcp_secret == 'true' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}

      - name: Configure Docker for Artifact Registry
        run: |
          gcloud auth configure-docker ${{ env.GCP_REGION }}-docker.pkg.dev --quiet

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy Container to Google Cloud Run
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.SERVICE_NAME }}
          image: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          region: ${{ env.GCP_REGION }}

      - name: Verify Live Production Health
        run: |
          echo "Waiting 10 seconds for Cloud Run revision traffic routing..."
          sleep 10
          echo "Running smoke test on ${{ env.PROD_HEALTH_URL }}..."
          STATUS_CODE=$(curl -s -o /dev/null -w "%{http_code}" "${{ env.PROD_HEALTH_URL }}")
          if [ "$STATUS_CODE" -ne 200 ]; then
            echo "Health check failed with HTTP status $STATUS_CODE"
            curl -s "${{ env.PROD_HEALTH_URL }}"
            exit 1
          fi
          echo "Production deployment is live and healthy (HTTP 200 OK)!"
          curl -s "${{ env.PROD_HEALTH_URL }}"

