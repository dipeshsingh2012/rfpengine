<!doctype html>
<html lang="en">
  <head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>RFQEngine</title><link rel="stylesheet" href="sidepanel.css"></head>
  <body>
    <header><div class="logo">R</div><div><strong>RFQ<span>Engine</span></strong><small>Response assistant</small></div><button id="scan" class="scan-button">Scan page</button></header>
    <main>
      <div class="page-actions"><div id="page-state" class="page-state">Open a questionnaire and scan the page.</div><button id="generate-all" class="generate-all" disabled>Generate all answers</button></div>
      <div class="settings"><label>Tenant <input id="tenant" value="acme-corp"></label><label>Sources <select id="top-k"><option>3</option><option selected>5</option><option>10</option></select></label></div>
      <div id="questions" class="questions"></div>
    </main>
    <template id="question-template"><article class="question-card"><div class="question-head"><span class="number"></span><span class="status"></span></div><h2 class="question"></h2><textarea class="answer" placeholder="Generate an answer to review..."></textarea><div class="card-footer"><span class="confidence"></span><button class="generate">Generate</button><button class="insert" hidden>Insert answer</button></div><div class="sources" hidden></div></article></template>
    <script src="sidepanel.js"></script>
  </body>
</html>
