<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Northstar Security Questionnaire</title><style>body{margin:0;background:#eef1f5;color:#172238;font:15px Arial,sans-serif}.top{background:#172238;color:white;padding:25px calc((100% - 760px)/2)}main{max-width:760px;margin:35px auto;padding:0 20px}.sheet{background:white;padding:32px;box-shadow:0 10px 30px #17223815}h1{margin:0 0 7px;font-size:25px}p{color:#617086;line-height:1.55}.meta{border-top:1px solid #e1e5eb;border-bottom:1px solid #e1e5eb;padding:15px 0;margin:25px 0;color:#617086;font-size:12px}section{margin:26px 0}h2{font-size:16px;border-bottom:1px solid #e1e5eb;padding-bottom:10px}label{display:block;font-weight:bold;font-size:13px;margin:18px 0 7px}textarea{display:block;width:100%;min-height:70px;padding:11px;border:1px solid #cbd3df;box-sizing:border-box;resize:vertical;font:14px Arial}button{margin-top:18px;background:#3759d7;color:#fff;border:0;padding:12px 20px;font-weight:bold}</style></head>
<body><div class="top">NORTHSTAR PROCUREMENT PORTAL</div><main><div class="sheet"><h1>Supplier security questionnaire</h1><p>Please provide complete responses for the following security and implementation questions.</p><div class="meta">RFP ID: NS-2026-041 &nbsp; | &nbsp; Due: September 12, 2026</div><section><h2>Information security</h2><label for="retention">Describe your data retention policy.</label><textarea id="retention" required></textarea><label for="encryption">Explain how customer data is encrypted.</label><textarea id="encryption" required></textarea><label for="certifications">List your relevant security certifications.</label><textarea id="certifications"></textarea></section><section><h2>Implementation and support</h2><label for="timeline">What is your typical implementation timeline?</label><textarea id="timeline" required></textarea><label for="support">What support options are included with the platform?</label><textarea id="support"></textarea></section><button type="button">Save draft</button></div></main></body></html>
